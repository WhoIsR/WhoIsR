<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1200 360"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">WhoIsR GitHub Profile</title>
  <desc id="desc">
    Animated profile header for WhoIsR.
  </desc>

  <style>
    .bg {
      fill: #0d1117;
    }

    .frame {
      fill: none;
      stroke: #30363d;
      stroke-width: 1.5;
    }

    .primary {
      fill: #f0f6fc;
    }

    .muted {
      fill: #8b949e;
    }

    .accent {
      fill: #3fb950;
    }

    .accent-stroke {
      stroke: #3fb950;
    }

    .mono {
      font-family:
        ui-monospace,
        SFMono-Regular,
        SF Mono,
        Menlo,
        Monaco,
        Consolas,
        Liberation Mono,
        monospace;
    }

    .eyebrow {
      font-size: 16px;
      font-weight: 500;
      letter-spacing: 4px;
    }

    .title {
      font-size: 92px;
      font-weight: 700;
      letter-spacing: 12px;

      opacity: 0;
      transform: translateY(12px);

      animation:
        title-in 0.9s cubic-bezier(.2,.8,.2,1)
        0.15s forwards;
    }

    .subtitle {
      font-size: 17px;
      letter-spacing: 3px;

      opacity: 0;

      animation:
        fade-in 0.8s ease
        0.65s forwards;
    }

    .meta {
      font-size: 14px;
      letter-spacing: 2px;
    }

    .pulse {
      transform-box: fill-box;
      transform-origin: center;

      animation:
        pulse 2s ease-in-out infinite;
    }

    .cursor {
      animation:
        blink 1.1s step-end infinite;
    }

    @keyframes title-in {
      from {
        opacity: 0;
        transform: translateY(12px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes fade-in {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes pulse {
      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.85);
      }

      50% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes blink {
      0%,
      45% {
        opacity: 1;
      }

      46%,
      100% {
        opacity: 0;
      }
    }

    @media (prefers-color-scheme: light) {
      .bg {
        fill: #ffffff;
      }

      .frame {
        stroke: #d0d7de;
      }

      .primary {
        fill: #1f2328;
      }

      .muted {
        fill: #656d76;
      }

      .accent {
        fill: #1a7f37;
      }

      .accent-stroke {
        stroke: #1a7f37;
      }
    }
  </style>

  <!-- background -->
  <rect
    class="bg"
    x="1"
    y="1"
    width="1198"
    height="358"
    rx="18"
  />

  <!-- outer frame -->
  <rect
    class="frame"
    x="18"
    y="18"
    width="1164"
    height="324"
    rx="12"
  />

  <!-- decorative corners -->
  <path
    class="accent-stroke"
    d="M42 72 V42 H72"
    fill="none"
    stroke-width="2"
  />

  <path
    class="accent-stroke"
    d="M1128 42 H1158 V72"
    fill="none"
    stroke-width="2"
  />

  <path
    class="frame"
    d="M42 288 V318 H72"
  />

  <path
    class="frame"
    d="M1128 318 H1158 V288"
  />

  <!-- top metadata -->
  <text
    x="64"
    y="73"
    class="mono muted eyebrow"
  >
    PROFILE / WHOISR
  </text>

  <text
    x="1136"
    y="73"
    text-anchor="end"
    class="mono muted meta"
  >
    NODE_001
  </text>

  <!-- main identity -->
  <text
    x="60"
    y="194"
    class="mono primary title"
  >
    WHOISR
  </text>

  <!-- cursor -->
  <rect
    x="487"
    y="120"
    width="7"
    height="78"
    class="accent cursor"
  />

  <!-- subtitle -->
  <text
    x="64"
    y="240"
    class="mono muted subtitle"
  >
    SOFTWARE ENGINEERING · CYBERSECURITY · AI · AUTOMATION
  </text>

  <!-- status -->
  <g transform="translate(64 297)">
    <circle
      cx="6"
      cy="-4"
      r="6"
      class="accent pulse"
    />

    <text
      x="25"
      y="0"
      class="mono primary meta"
    >
      SYSTEM READY
    </text>
  </g>

  <!-- address -->
  <text
    x="1136"
    y="297"
    text-anchor="end"
    class="mono muted meta"
  >
    github.com/WhoIsR
  </text>

  <!-- animated scanner -->
  <line
    x1="42"
    x2="1158"
    y1="90"
    y2="90"
    class="accent-stroke"
    stroke-width="1"
    opacity="0.08"
  >
    <animate
      attributeName="y1"
      values="90;290;90"
      dur="8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="y2"
      values="90;290;90"
      dur="8s"
      repeatCount="indefinite"
    />

    <animate
      attributeName="opacity"
      values="0;0.12;0"
      dur="8s"
      repeatCount="indefinite"
    />
  </line>
</svg>